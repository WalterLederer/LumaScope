<div class="markdown-help">
  <header class="markdown-help-header">
    <div class="markdown-help-document">
      <strong>{{ documentTitle() }}</strong>
      <span class="markdown-help-file-path" [title]="documentationPath()">File: {{ documentationPath() }}</span>
    </div>
    <div class="markdown-help-header-actions">
      <button type="button" class="markdown-open-file-button" (click)="openCurrentDocument()" title="Open this Markdown file with the Windows default app" aria-label="Open Markdown file with default app"><span aria-hidden="true">↗</span></button>
      <button type="button" class="markdown-home-button" (click)="showReadme()" title="Home" aria-label="Home"><span aria-hidden="true">⌂</span></button>
      <label class="markdown-font-size">
      <span>Text size</span>
      <ui-slider [min]="10" [max]="20" [step]="1" [value]="fontSize()" (valueChange)="onFontSizeChange($event)" (valueCommit)="saveFontSize()" aria-label="Documentation text size" />
      <output>{{ fontSize() }} px</output>
      </label>
    </div>
  </header>
  @if (openFileError()) {
    <p class="markdown-state markdown-error" role="alert">{{ openFileError() }}</p>
  }
  @if (loading()) {
    <p class="markdown-state" role="status">Loading documentation…</p>
  } @else if (error()) {
    <p class="markdown-state markdown-error" role="alert">{{ error() }}</p>
  } @else {
    <article class="markdown-body" [style.font-size.px]="fontSize()" [innerHTML]="renderedHtml()" (click)="onDocumentClick($event)"></article>
  }
</div>
