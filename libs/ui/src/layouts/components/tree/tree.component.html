@let rootNode = treeRoot();
@let menuRef = menu();

@if (rootNode !== null) {
  <ng-template #nodeTemplate let-node="node" let-level="level" let-rowNumber="rowNumber">
    <div class="tree-branch" [class.root-folder]="level === 1">
      <ui-tree-node [node]="node"
                    [level]="level"
                    [rowNumber]="rowNumber ?? null"
                    [menu]="menuRef"
                    [inlineActions]="inlineActions()"
                    [reorderActions]="reorderActions()"
                    (pressed)="nodeSelected($event)"
                    (action)="action.emit($event)"
                    (move)="move.emit($event)"
                    (hovered)="hovered.emit($event)" />
      @if (node.children !== undefined && node.children.length > 0 && node.isOpen) {
        <div class="children-container" animate.enter="enter-animation" animate.leave="leave-animation">
          <div class="wrapper">
            @for (child of node.children; track child.id) {
              <ng-template [ngTemplateOutlet]="nodeTemplate"
                           [ngTemplateOutletContext]="{ node: child, level: level + 1, rowNumber: level === 0 ? $index + 1 : null }" />
            }
          </div>
        </div>
      }
    </div>
  </ng-template>
  <ng-template [ngTemplateOutlet]="nodeTemplate" [ngTemplateOutletContext]="{ node: rootNode, level: 0, rowNumber: null }" />
}
