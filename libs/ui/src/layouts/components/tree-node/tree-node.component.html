@let currentNode = node();
@let currentMenu = menu();

@if (currentNode.hasChildren === true) {
  <span class="expand-indicator" [class.expanded]="currentNode.isOpen === true">›</span>
} @else {
  <span class="expand-placeholder"></span>
}

<ui-icon [icon]="icon()" class="prefix" />

<ui-text>{{ currentNode.label }}</ui-text>

<div class="spacer"></div>

@if (inlineActions() && currentNode.id !== undefined) {
  <button type="button"
          class="tree-inline-action"
          [attr.aria-label]="currentNode.id === '' ? 'Add location' : 'Remove favourite'"
          [title]="currentNode.id === '' ? 'Add location' : 'Remove favourite'"
          (click)="onAction($event)"
          uiStopPropagation>{{ currentNode.id === '' ? '+' : 'x' }}</button>
} @else if (currentMenu !== null && currentNode.hideMenu !== true) {
  <ui-action-button class="action"
                    [cdkMenuTriggerFor]="currentMenu"
                    [cdkMenuTriggerData]="{ data: currentNode }"
                    uiStopPropagation>
    <ui-icon icon="moreVertical" [inherit]="true" />
  </ui-action-button>
}
