@let currentNode = node();
@let currentMenu = menu();

@if (currentNode.hasChildren === true) {
  <span class="expand-indicator" [class.expanded]="currentNode.isOpen === true">›</span>
} @else {
  <span class="expand-placeholder"></span>
}

<ui-icon [icon]="icon()" [colorOverride]="'#f5c542'" class="prefix" />

<ui-text>{{ currentNode.label }}</ui-text>

<div class="spacer"></div>

@if (currentMenu !== null && currentNode.hideMenu !== true) {
  <ui-action-button class="action"
                    [cdkMenuTriggerFor]="currentMenu"
                    [cdkMenuTriggerData]="{ data: currentNode }"
                    uiStopPropagation>
    <ui-icon icon="moreVertical" [inherit]="true" />
  </ui-action-button>
}
